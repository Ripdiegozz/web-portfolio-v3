name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Fresh checkout has no .astro/types.d.ts; astro check needs it.
      - run: cd apps/web && bunx astro sync
      - run: bunx turbo lint typecheck test build
      # E2E: Playwright smoke against the built worker (dev server works on Linux).
      - run: cd apps/web && bunx playwright install --with-deps chromium
      - run: cd apps/web && bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
